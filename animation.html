<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 200px;
            width: 200px;
            background-color: aqua;
            animation-name: a;
            animation-duration: 8s;
            animation-timing-function: ease-in;
            animation-delay: 0.5s;
            animation-direction: normal;
            animation-iteration-count: infinite;
            animation-fill-mode: forwards;
        }
        @keyframes a{
            /* from{background-color: aqua;}
            to{background-color: yellow;transform: rotate(3600deg);margin-left: 500px;border-radius: 50%;} */
0%{background-color: aqua;}
20%{background-color:transparent;margin-left: 500px;;}
50%{background-color: chartreuse;height: 100px;width: 100px;font-size: 100px;}
75%{background-color: orange;height: 50px;width: 50px;}
100%{background-color: yellow;height: 0px;width: 0px;}
        }
    </style>
</head>
<body>
    <div>hello</div>
</body>
</html>
