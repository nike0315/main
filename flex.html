<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #p{
            height: 800px;
            width: 600px;
            border: 2px solid;
            display: flex;
            flex-direction: column;
            flex-direction: column-reverse;
            flex-direction: row-reverse;
            flex-direction: row;
            justify-content: center;
            /* gap: 50px; */
            justify-content: space-around;
            justify-content: space-between;
            justify-content: space-evenly;
            align-items: center;
            text-align: center;
            flex-wrap: wrap;
        }
        .c{
            height: 100px;
            width: 100px;
            border: 2px solid;
        }
    </style>
</head>
<body>
    <div id="p">
        <div class="c">one</div>
        <div style="align-self: flex-start;" class="c">two</div>
        <div class="c">three</div>
        <div style="align-self: flex-end; flex-grow: 5;" class="c">four</div>
        <div class="c">five</div>
    </div>
</body>
</html>
